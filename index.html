<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Storyboard Assistant</title>
    <!-- Minimal styling via Tailwind Play CDN for quick dev (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900">
    <div id="root"></div>

    <!-- React + ReactDOM from CDN (production builds) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Load the app script which expects React & ReactDOM as globals -->
    <script src="./main.js"></script>
  </body>
</html>
